<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20" />
      <stop offset="50%" stop-color="#181135" />
      <stop offset="100%" stop-color="#0A0914" />
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- U Shape Gradient -->
    <linearGradient id="uGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE" />
      <stop offset="35%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Play/Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Neon Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4" stroke-opacity="0.8" />

  <!-- Subtle Radial Ambient Light -->
  <circle cx="256" cy="240" r="170" fill="#8B5CF6" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Outer Camera / Aperture Ring -->
  <circle cx="256" cy="256" r="150" stroke="url(#rimGrad)" stroke-width="3" stroke-dasharray="12 18" stroke-opacity="0.4" />

  <!-- Stylized Geometric U Monogram -->
  <path d="M168 152 V272 C168 320 206 360 256 360 C306 360 344 320 344 272 V152 H302 V270 C302 296 281 316 256 316 C231 316 210 296 210 270 V152 H168 Z" fill="url(#uGrad)" />

  <!-- Play / AI Synthesis Core -->
  <polygon points="238 214, 238 290, 298 252" fill="url(#coreGrad)" filter="url(#glow)" />

  <!-- AI 4-Point Sparkle -->
  <path d="M370 120 C370 134 380 144 394 144 C380 144 370 154 370 168 C370 154 360 144 346 144 C360 144 370 134 370 120 Z" fill="#F472B6" />
</svg>